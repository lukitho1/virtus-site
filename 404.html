<!doctype html>
<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Virtus</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/marca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#040A1A;--panel:#091431;--fg:#F2F5FB;--silver:#BAC5DC;--accent:#2D63FF;--red:#E0203F;--glow:rgba(45,99,255,.25)}
html.black{--bg:#0B0C0E;--panel:#16171C;--silver:#C8C9CE;--accent:#E0203F;--glow:rgba(224,32,63,.28)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:radial-gradient(60% 50% at 50% 30%,var(--glow),transparent 70%),var(--bg);color:var(--fg);font-family:"IBM Plex Sans",Arial,sans-serif;text-align:center}
.box{max-width:520px}
.logo{height:46px;width:auto;margin:0 auto 28px;display:block}
.code{font-family:"Archivo",Arial,sans-serif;font-weight:900;font-size:clamp(88px,22vw,150px);line-height:.9;letter-spacing:-.04em;background:linear-gradient(180deg,#fff,var(--silver));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:clamp(24px,5vw,32px);margin:14px 0 8px;letter-spacing:-.02em}
p{color:var(--silver);margin:0 0 26px;line-height:1.55}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font-weight:700;text-decoration:none;font-size:15px}
.btn-main{background:var(--accent);color:#fff;box-shadow:0 8px 26px var(--glow)}
.btn-line{border:1.5px solid rgba(255,255,255,.25);color:var(--fg)}
</style>
</head>
<body>
<div class="box">
  <a href="/"><img class="logo" src="/img/logo.png" alt="Virtus Peptides"></a>
  <div class="code">404</div>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado ou foi digitado errado. Volte ao catálogo para continuar.</p>
  <div class="btns">
    <a class="btn btn-main" href="/">Ver o catálogo</a>
    <a class="btn btn-line" href="/protocolos/">Protocolos</a>
  </div>
</div>
</body>
</html>
